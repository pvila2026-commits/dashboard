<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>PVILA — Admin Reports</title>
<style>body{font-family:system-ui,sans-serif;background:#faf6ee;color:#2a1a1a;margin:0;padding:24px}h1{color:#5b1420;margin:0}input,button{padding:10px 14px;border:1px solid #d9c9a8;border-radius:8px;font:inherit}button{background:#5b1420;color:#fff;border:0;cursor:pointer}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.st{display:flex;gap:14px;margin:14px 0}.st div{background:#fff;border:1px solid #e6d6b8;border-radius:12px;padding:12px 22px}.st b{display:block;font-size:1.5rem;color:#5b1420}.tw{overflow:auto;background:#fff;border:1px solid #e6d6b8;border-radius:12px}table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{padding:9px 12px;border-bottom:1px solid #f0e6d2;white-space:nowrap;text-align:left}th{background:#f3ead9;position:sticky;top:0}</style></head><body>
<h1>PVILA — Bookings Report</h1><p>Reads live from your Google Sheet database. Admin key is kept only in this browser tab.</p>
<div class="bar"><input id="k" type="password" placeholder="ADMIN_KEY"><button onclick="load()">Load bookings</button><button onclick="dl()">⬇ Download CSV report</button></div><div class="st"><div><b id="n">0</b>Bookings</div><div><b id="p">0</b>Paid</div><div><b id="r">₹0</b>Collected (advance+security)</div></div><div class="tw"><table id="t"></table></div><p id="e" style="color:#b3261e"></p>
<script src="config.js"></script><script>
let R=[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){$('#e').textContent='';const U=PV.BACKEND_URL;if(!U){R=JSON.parse(localStorage.pv_bookings||'[]');$('#e').textContent='Demo mode: showing bookings saved in THIS browser only. Set BACKEND_URL in config.js for the real database.'}
else{sessionStorage.k=$('#k').value;const j=await (await fetch(U+'?action=list&key='+encodeURIComponent($('#k').value))).json();if(!j.ok)return $('#e').textContent=j.error;R=j.rows}
const H=R[0]?Object.keys(R[0]):[];$('#t').innerHTML='<tr>'+H.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+R.map(r=>'<tr>'+H.map(h=>'<td>'+esc(r[h])+'</td>').join('')+'</tr>').join('');
const paid=R.filter(r=>r.status==='Paid');$('#n').textContent=R.length;$('#p').textContent=paid.length;$('#r').textContent='₹'+paid.reduce((a,r)=>a+(+r.pay_now||0),0).toLocaleString('en-IN')}
function dl(){if(!R.length)return alert('Load bookings first');const H=Object.keys(R[0]),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',c=[H.join(',')].concat(R.map(r=>H.map(h=>q(r[h])).join(','))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='panchanan-bookings-'+new Date().toISOString().slice(0,10)+'.csv';a.click()}
</script></body></html>
